name: Release

# Publishes a GitHub release of the signed debug APK, which is what the tutor installs (D9, D12).
#
# Runs after CI passes on a push to Rebuild_v2. It reads versionName from app/build.gradle.kts and
# releases it only when its CHANGELOG.md section carries a date (`## [X.Y.Z] - YYYY-MM-DD`): an
# `Unreleased` section, or a version whose tag already exists, ends the run without releasing anything.
# The APK attached is the minified app-release artifact CI built for that commit (D16), after its
# signing certificate is checked against SIGNING_CERT_SHA256.
#
# Run it by hand with a commit SHA to release an earlier commit. That commit needs a green CI run whose
# app-release artifact has not expired (14 days).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [Rebuild_v2]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to release
        required: true
        default: Rebuild_v2

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Read version and changelog date
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=app/build.gradle.kts::versionName '$version' is not plain SemVer MAJOR.MINOR.PATCH"
            exit 1
          fi
          heading=$(grep -m1 -F "## [$version]" CHANGELOG.md || true)
          if [[ "$heading" != "## [$version]"* ]]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section in CHANGELOG.md for versionName $version"
            exit 1
          fi
          date=$(sed -n 's/^## \[[^]]*\] - \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)$/\1/p' <<< "$heading")
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$date" ]; then
            echo "::notice::CHANGELOG.md does not date $version yet ('$heading'); nothing to release"
          fi

      - name: Check for an existing tag
        id: existing
        if: steps.version.outputs.date != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists; nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on && /^\[[^]]+\]: http/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::The '## [$VERSION]' section in CHANGELOG.md is empty"
            exit 1
          fi

      - name: Download the APK CI built for this commit
        if: steps.existing.outputs.exists == 'false'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow ci.yml --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run for $SHA. Push the commit or re-run CI, then run this workflow again."
            exit 1
          fi
          if ! gh run download "$RUN_ID" --name app-release --dir apk; then
            echo "::error::CI run $RUN_ID has no app-release artifact (it expires after 14 days). Re-run that CI run, then run this workflow again."
            exit 1
          fi
          ls -l apk

      # A build signed with any other key cannot be installed over the tutor's current one without
      # uninstalling, which deletes their data (README, "Install a test build"). Never publish one.
      - name: Check the signing certificate
        if: steps.existing.outputs.exists == 'false'
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          EXPECTED="$(echo "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Repository variable SIGNING_CERT_SHA256 is not set, so the APK's signing key cannot be checked. Set up the signing key (README) before releasing."
            exit 1
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs apk/app-release.apk | grep -m1 "certificate SHA-256 digest" | sed 's/.*digest: //' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::apk/app-release.apk is signed with $ACTUAL, not the expected SIGNING_CERT_SHA256 $EXPECTED."
            exit 1
          fi
          echo "Signed with the owner's key (fingerprint matches SIGNING_CERT_SHA256)."

      - name: Create tag and release
        if: steps.existing.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          cp apk/app-release.apk "course-invoicer-$VERSION.apk"
          gh release create "$TAG" "course-invoicer-$VERSION.apk" \
            --target "$SHA" \
            --title "Course Invoicer $VERSION" \
            --notes-file notes.md
          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) from $SHA." >> "$GITHUB_STEP_SUMMARY"
