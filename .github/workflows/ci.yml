name: CI

# CI runs once per branch push, so a branch is tested before it has a pull request, and a pull request
# shows the checks of its head commit's push run: nothing runs twice and nothing is skipped. There is
# no pull_request trigger: pull requests come only from this repository's own branches (the code is
# proprietary, no forks). Tag pushes do not run CI.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets live in the "release" environment, which only Rebuild_v2 may use
    # (docs/SIGNING_BRIEF.md, D23). A build of any other branch never gets them, whatever its own build
    # files do, and signs with the debug key. An empty name means no environment.
    environment: ${{ github.ref == 'refs/heads/Rebuild_v2' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships the Android SDK; AGP downloads the exact platform it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      # The HTML report is an artifact; print every finding into the log too so it can be read anywhere.
      - name: Print lint findings
        if: always()
        run: |
          SARIF=app/build/reports/lint-results-debug.sarif
          [ -f "$SARIF" ] || exit 0
          jq -r '.runs[].results[] | "\(.level) \(.ruleId): \(.message.text) @ \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"' "$SARIF" | tee lint-findings.txt
          echo "Lint findings: $(wc -l < lint-findings.txt)"

      # The between-release build: a separate app, gr.edusuite.invoicer.debug, signed with the stock
      # debug key, so it never installs over the tutor's real app or touches its data (D23).
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # The minified APK that GitHub releases ship (D16). On Rebuild_v2 it is signed with the owner's
      # permanent key from the release environment; the password reaches only this step, never
      # GITHUB_ENV, and the decoded keystore is deleted when the step ends. Other branches get no
      # secrets and sign it with the debug key, so it can never be published.
      - name: Assemble release (minified)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS || 'release' }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            if [ -z "$SIGNING_PASSWORD" ]; then
              echo "::error::The SIGNING_KEYSTORE_B64 secret is set but SIGNING_PASSWORD is missing."
              exit 1
            fi
            export INVOICER_RELEASE_KEYSTORE="$RUNNER_TEMP/invoicer-release.p12"
            trap 'rm -f "$INVOICER_RELEASE_KEYSTORE"' EXIT
            printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d ' \r\n' | base64 --decode > "$INVOICER_RELEASE_KEYSTORE"
            unset SIGNING_KEYSTORE_B64
            export INVOICER_KEYSTORE_PASSWORD="$SIGNING_PASSWORD"
            export INVOICER_KEY_ALIAS="$SIGNING_KEY_ALIAS"
            echo "SIGNED_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/Rebuild_v2" ]; then
            echo "::error::The SIGNING_KEYSTORE_B64 secret is missing from the release environment. Builds on Rebuild_v2 must be signed with the owner's key (README, Signing key)."
            exit 1
          else
            echo "::notice::No signing secrets on this branch: app-release.apk is signed with the debug key and cannot install over a release."
          fi
          # No daemon: the password must not outlive this step in a long-running process.
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # Prints the certificate of both APKs. On Rebuild_v2, or whenever the owner's key was used, fails the
      # build unless app-release.apk is signed by exactly the key whose fingerprint is in the repository
      # variable SIGNING_CERT_SHA256 (any format: colons and case are ignored).
      - name: Check the signing certificate
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          EXPECTED="$(echo "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
            echo "$APK:" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$CERTS" | grep -E "certificate (DN|SHA-256)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          RELEASE_CERTS="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          if [ "$SIGNED_WITH_RELEASE_KEY" != "true" ] && [ "$GITHUB_REF" != "refs/heads/Rebuild_v2" ]; then
            echo "app-release.apk is signed with the debug key: not for release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::error::Repository variable SIGNING_CERT_SHA256 is not set, so the release certificate cannot be checked."
            exit 1
          fi
          SIGNERS="$(echo "$RELEASE_CERTS" | grep -c "certificate SHA-256 digest" || true)"
          if [ "$SIGNERS" != "1" ]; then
            echo "::error::app-release.apk has $SIGNERS signers; expected exactly one."
            exit 1
          fi
          ACTUAL="$(echo "$RELEASE_CERTS" | grep -m1 "certificate SHA-256 digest" | sed 's/.*digest: //' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::app-release.apk is signed with $ACTUAL, not the expected SIGNING_CERT_SHA256 $EXPECTED."
            exit 1
          fi
          echo "app-release.apk is signed with the owner's key (fingerprint matches SIGNING_CERT_SHA256)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # release.yml attaches this one to GitHub releases.
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
      # avdmanager and the emulator default to different AVD folders; pin both to one place.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "emulator" "platform-tools" "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$SYSTEM_IMAGE" --force
          ls "$ANDROID_AVD_HOME"

      # The emulator boots in the background while Gradle builds, instead of after it: the boot
      # (about a minute) and the build (about three) overlap.
      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          echo $! > emulator.pid

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace

      # Fails fast with the emulator log in the job output (artifacts are hard to read from some sandboxes).
      - name: Boot emulator and run instrumented tests
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ls -l /dev/kvm || true
          "$EMULATOR" -accel-check || true
          EMULATOR_PID="$(cat emulator.pid)"
          booted=""
          for attempt in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator exited before booting"; cat emulator.log; exit 1
            fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=yes; break
            fi
            sleep 5
          done
          if [ -z "$booted" ]; then
            echo "::error::Emulator did not boot within 7.5 minutes"; tail -100 emulator.log; exit 1
          fi
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$ADB" shell settings put global "$setting" 0
          done
          "$ADB" shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest --stacktrace

          # Smoke test for the minified APK (D16): R8 may strip something the debug tests can't see.
          # The tests ran as the separate debug app (gr.edusuite.invoicer.debug), so this is a clean install
          # of gr.edusuite.invoicer. This job has no secrets, so the APK is debug-signed.
          "$ADB" install -r app/build/outputs/apk/release/app-release.apk
          "$ADB" logcat -c
          "$ADB" shell am start -W -n gr.edusuite.invoicer/.MainActivity
          # am start -W returns once the first frame is drawn; give a crash on start a few seconds to show.
          sleep 3
          if ! "$ADB" shell pidof gr.edusuite.invoicer > /dev/null; then
            echo "::error::The minified app is not running after launch"; "$ADB" logcat -d | tail -200; exit 1
          fi
          "$ADB" shell monkey -p gr.edusuite.invoicer -s 42 --throttle 100 --pct-syskeys 0 --pct-appswitch 0 \
            --ignore-timeouts 300 > monkey.log 2>&1 || true
          if grep -q "CRASH: gr.edusuite.invoicer" monkey.log || "$ADB" logcat -d -b crash | grep -q "Process: gr.edusuite.invoicer"; then
            echo "::error::The minified app crashed during the smoke test"
            cat monkey.log; "$ADB" logcat -d -b crash; exit 1
          fi
          echo "Minified APK smoke test passed (launch plus 300 monkey events)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Print instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      print(f"::error::FAILED {case.get('classname')}.{case.get('name')}")
                      print((problem.text or problem.get("message") or "")[:4000])
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            monkey.log
          retention-days: 14
