name: CI

on:
  push:
    branches: [main, Rebuild, Rebuild_v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships the Android SDK; AGP downloads the exact platform it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "emulator" "platform-tools" "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$SYSTEM_IMAGE" --force

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Boot emulator and run instrumented tests
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          "$ADB" wait-for-device
          for attempt in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { tail -50 emulator.log; exit 1; }
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$ADB" shell settings put global "$setting" 0
          done
          "$ADB" shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
          retention-days: 14
