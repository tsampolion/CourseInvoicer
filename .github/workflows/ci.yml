name: CI

on:
  push:
    branches: [main, Rebuild, Rebuild_v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships the Android SDK; AGP downloads the exact platform it needs.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Before the first Gradle run, so the Gradle daemon starts with the key's path in its environment.
      # The debug APK is what the tutor installs (README). Signing every build with one stable key lets a new
      # build install over the previous one and keep the data. Without the secret, the build still passes
      # but the APK is signed with a throwaway key; see README, "Install a test build".
      - name: Use the stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 is not set: this app-debug.apk cannot be installed over an earlier build. See README."
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "EDUINVOICE_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      # The HTML report is an artifact; print every finding into the log too so it can be read anywhere.
      - name: Print lint findings
        if: always()
        run: |
          SARIF=app/build/reports/lint-results-debug.sarif
          [ -f "$SARIF" ] || exit 0
          jq -r '.runs[].results[] | "\(.level) \(.ruleId): \(.message.text) @ \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"' "$SARIF" | tee lint-findings.txt
          echo "Lint findings: $(wc -l < lint-findings.txt)"

      # MARKED FOR DELETION (D9): assembleRelease (R8 + lintVitalRelease). Keep assembleDebug,
      # which builds the APK the README installs. See docs/PRODUCT_SPEC.md §8.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # Compare this fingerprint across runs (and with `keytool -list -v` on your keystore): when it stays the
      # same, each build installs over the previous one.
      - name: Show debug signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate (DN|SHA-256)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
      # avdmanager and the emulator default to different AVD folders; pin both to one place.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "emulator" "platform-tools" "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$SYSTEM_IMAGE" --force
          ls "$ANDROID_AVD_HOME"

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      # Fails fast with the emulator log in the job output (artifacts are hard to read from some sandboxes).
      - name: Boot emulator and run instrumented tests
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ls -l /dev/kvm || true
          "$EMULATOR" -accel-check || true
          "$EMULATOR" -list-avds
          "$EMULATOR" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          EMULATOR_PID=$!
          booted=""
          for attempt in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator exited before booting"; cat emulator.log; exit 1
            fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=yes; break
            fi
            sleep 5
          done
          if [ -z "$booted" ]; then
            echo "::error::Emulator did not boot within 7.5 minutes"; tail -100 emulator.log; exit 1
          fi
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$ADB" shell settings put global "$setting" 0
          done
          "$ADB" shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Print instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      print(f"::error::FAILED {case.get('classname')}.{case.get('name')}")
                      print((problem.text or problem.get("message") or "")[:4000])
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
          retention-days: 14
